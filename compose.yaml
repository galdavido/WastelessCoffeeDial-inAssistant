# Local development stack. Reads credentials from .env (see .env.example).
#   docker compose up --build
name: wcda

services:
  db:
    # pgvector image kept for continuity with the live volume. No migration uses
    # the `vector` extension any more; plain postgres:16 is what CI runs.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-barista_db}
    # Bound to localhost only - not reachable from the network.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barista} -d ${POSTGRES_DB:-barista_db}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Everything addresses this database as `wcda-dev-db`, never as `db`.
    # The prod stack also has a service called `db`, so the moment a container
    # here joins the prod network as well -- which compose.admin.yaml does --
    # the bare name resolves to whichever answers first. That silently pointed
    # the dev app at the friends database for half a day. A unique alias exists
    # on this network only and cannot be confused with anything.
    networks:
      default:
        aliases:
          - wcda-dev-db

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-barista}:${POSTGRES_PASSWORD}@wcda-dev-db:5432/${POSTGRES_DB:-barista_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      WEB_PORT: "8080"
      LOG_IMAGES_DIR: /app/data/log_images
      # Startup logs (the migration summary, warn_if_misconfigured) are block
      # buffered without this and never reach `docker logs`.
      PYTHONUNBUFFERED: "1"
      # Single-user: every request maps to one implicit owner ("owner"). This is
      # the dev instance -- no identity handling, reachable directly on the LAN.
      WCDA_AUTH_MODE: ${WCDA_AUTH_MODE:-single}
    depends_on:
      db:
        condition: service_healthy
    # Published on all host interfaces so phones / other LAN devices can reach
    # the dev instance directly at http://<host-ip>:8082. Port 8082, not 8081:
    # the prod stack holds 8081 on this host and the two must run side by side.
    # Plain HTTP on a bare IP is not a "secure context", so the service worker /
    # offline cache will not register (Add-to-Home-Screen still works).
    ports:
      - "8082:8080"
    volumes:
      - log_images:/app/data/log_images
    security_opt:
      - no-new-privileges:true

  # Nightly pg_dump with rotation, same as the prod stack has. This instance is
  # the one actually used day to day, so its data is not scratch -- it is the
  # real bean/shot history and needs a backup of its own. Dumps land in
  # ./backups/dev-db/ on the host. Restore the latest with:
  #   gunzip -c backups/dev-db/last/<db>-latest.sql.gz \
  #     | docker compose exec -T db psql -U barista -d barista_db
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: wcda-dev-db
      POSTGRES_DB: ${POSTGRES_DB:-barista_db}
      POSTGRES_USER: ${POSTGRES_USER:-barista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_EXTRA_OPTS: "--no-owner --no-privileges"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups/dev-db:/backups
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  log_images:
