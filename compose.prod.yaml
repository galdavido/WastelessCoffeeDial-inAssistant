# Production stack. Usage:
#   docker compose -f compose.prod.yaml --env-file .env up -d --build
name: wcda-prod

services:
  db:
    # pgvector image: the schema uses the `vector` extension (scraped_equipment.embedding).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-barista_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host at all - only reachable on the internal network.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barista} -d ${POSTGRES_DB:-barista_db}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-barista}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-barista_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      WEB_PORT: "8080"
      LOG_IMAGES_DIR: /app/data/log_images
    depends_on:
      db:
        condition: service_healthy
    # Published on all host interfaces so phones / other LAN devices can reach it
    # directly at http://<host-ip>:8081. Note: plain HTTP on a bare IP is not a
    # "secure context", so the service worker / offline PWA cache will not run
    # (Add-to-Home-Screen still works). Put a TLS reverse proxy in front for that.
    ports:
      - "8081:8080"
    read_only: true
    volumes:
      - log_images:/app/data/log_images
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly pg_dump with rotation. Dumps land in ./backups/db/ on the host
  # (gzip'd, one per run). Restore the latest with:
  #   gunzip -c backups/db/last/<db>-latest.sql.gz \
  #     | docker compose -f compose.prod.yaml exec -T db psql -U barista -d barista_db
  # Trigger an off-schedule backup with:
  #   docker compose -f compose.prod.yaml exec db-backup /backup.sh
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-barista_db}
      POSTGRES_USER: ${POSTGRES_USER:-barista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_EXTRA_OPTS: "--no-owner --no-privileges"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "14"
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups/db:/backups
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  log_images:

networks:
  backend:
    driver: bridge
