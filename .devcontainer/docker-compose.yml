# Dev container stack. Credentials come from the repo-root .env (see .env.example).
name: wcda-devcontainer

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    environment:
      PYTHONPATH: /workspace/src
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-barista}:${POSTGRES_PASSWORD:-barista}@db:5432/${POSTGRES_DB:-barista_db}
    env_file:
      - path: ../.env
        required: false
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barista}
      POSTGRES_DB: ${POSTGRES_DB:-barista_db}
    volumes:
      - devcontainer_postgres_data:/var/lib/postgresql/data

volumes:
  devcontainer_postgres_data:
