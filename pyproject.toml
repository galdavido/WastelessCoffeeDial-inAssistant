[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wcda"
version = "0.2.0"
description = "Wasteless Coffee Dial-in Assistant - FastAPI + Gemini espresso dial-in helper."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENCE"]

dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.48",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "google-genai==1.67.0",
    "pillow==12.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # starlette.testclient is typed against httpx2; plain httpx leaves
    # TestClient Unknown to pyright and warns at runtime.
    "httpx2>=2.13",
    "ruff>=0.6",
    "mypy>=1.11",
    # Pinned: each release adds checks, which would redden unrelated PRs.
    "pyright==1.1.406",
    "pip-audit>=2.7",
]
# Offline model comparison only (core.challengers, wcda-backtest --compare).
# Never in requirements.txt: the web image does not import it.
ml = [
    "scikit-learn>=1.5",
]

[project.scripts]
wcda-backtest = "core.backtest_cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ai", "core", "database"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# The same settings Pylance reads, so the editor and CI agree.
[tool.pyright]
include = ["src", "tests", "migrations"]
extraPaths = ["src", "tests"]
# The interpreter every image and CI runs. At 3.12 typeshed has no
# string.templatelib, so pyright parses the 3.14 stdlib source and reports
# its t-strings; mypy still checks the 3.12 floor of requires-python.
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
