[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wcda"
version = "0.2.0"
description = "Wasteless Coffee Dial-in Assistant - FastAPI + Gemini espresso dial-in helper."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENCE"]

dependencies = [
    "fastapi==0.135.1",
    "uvicorn==0.42.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.48",
    "alembic>=1.13,<2.0",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "google-genai==1.67.0",
    "pillow==12.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[project.scripts]
wcda = "core.main:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be called in defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["ai", "core", "database"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
